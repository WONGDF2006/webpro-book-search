<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Search · Open Library</title>
  <link rel="icon" href="data:,">
  <!--
    Book Search App — Web Programming, Weeks 6–7 lab.
    Searches the Open Library API with fetch() and shows the results as cards,
    with loading skeletons, empty and error states.
  -->
  <style>
    :root {
      --navy: #1b2540;
      --blue: #1a56db;
      --bg: #f1f5f9;
      --card: #ffffff;
      --line: #cbd5e1;
      --ink: #1e293b;
      --muted: #475569;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .site-header { padding: 28px 16px; text-align: center; color: white; background: var(--navy); }
    .site-header h1 { margin: 0 0 4px; }
    .site-header p { margin: 0; color: #a5b4cf; font-size: .9rem; }

    main { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }

    .search-bar { display: flex; gap: 10px; margin-bottom: 12px; }
    .search-bar input { flex: 1; min-width: 0; padding: 12px 16px; font-size: 1rem; border: 2px solid var(--line); border-radius: 8px; }
    .search-bar input:focus { outline: none; border-color: var(--blue); }
    .search-bar button { padding: 12px 28px; font-size: 1rem; font-weight: 700; color: white; background: var(--blue); border: none; border-radius: 8px; cursor: pointer; }

    .status { min-height: 1.5em; margin: 0 0 16px; color: var(--muted); }

    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .book-card { display: flex; flex-direction: column; overflow: hidden; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .book-card img, .no-cover { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: #e2e8f0; }
    .no-cover { display: grid; place-items: center; font-size: 3rem; }
    .book-info { padding: 12px 14px 16px; }
    .book-info h2 { margin: 0 0 6px; font-size: .95rem; line-height: 1.3; }
    .book-info p { margin: 0; color: var(--muted); font-size: .82rem; }

    .site-footer { padding: 20px 16px; text-align: center; color: var(--muted); font-size: .85rem; }
    .site-footer a { color: var(--blue); }

    .search-bar button:disabled { opacity: .6; cursor: wait; }

    .skeleton .no-cover, .skeleton .line { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    .skeleton .no-cover { font-size: 0; }
    .skeleton .line { height: 12px; margin-bottom: 8px; border-radius: 4px; }
    .skeleton .line.short { width: 60%; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .message { grid-column: 1 / -1; padding: 40px 16px; text-align: center; color: var(--muted); }
    .message.error { color: #dc2626; }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>📚 Book Search</h1>
    <p>Search the Open Library — millions of books, free</p>
  </header>

  <main>
    <form id="search-form" class="search-bar" role="search">
      <label for="search-input" class="visually-hidden">Book title</label>
      <input id="search-input" type="search" name="q" placeholder="e.g. harry potter" required>
      <button id="search-button" type="submit">Search</button>
    </form>

    <p id="status" class="status" aria-live="polite"></p>

    <section id="results" class="results" aria-label="Search results"></section>
  </main>

  <footer class="site-footer">
    <p>Data from <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a></p>
  </footer>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('search-input');
    const statusText = document.getElementById('status');
    const button = document.getElementById('search-button');

    const API = 'https://openlibrary.org/search.json';

    async function searchBooks(query) {
      const url = API + '?q=' + encodeURIComponent(query) + '&limit=12';
      const res = await fetch(url);
      if (!res.ok) throw new Error('Server answered with status ' + res.status);
      const data = await res.json();
      return data.docs;
    }

    const results = document.getElementById('results');

    function createCard(book) {
      const card = document.createElement('article');
      card.className = 'book-card';

      // cover_i may be undefined — show a placeholder instead of a broken image
      if (book.cover_i) {
        const img = document.createElement('img');
        img.src = 'https://covers.openlibrary.org/b/id/' + book.cover_i + '-M.jpg';
        img.alt = 'Cover of ' + book.title;
        img.loading = 'lazy';
        card.appendChild(img);
      } else {
        const noCover = document.createElement('div');
        noCover.className = 'no-cover';
        noCover.textContent = '📚';
        card.appendChild(noCover);
      }

      const info = document.createElement('div');
      info.className = 'book-info';
      const title = document.createElement('h2');
      title.textContent = book.title;
      const meta = document.createElement('p');
      const author = book.author_name ? book.author_name[0] : 'Unknown author';
      meta.textContent = author + ' · ' + (book.first_publish_year || 'n.d.');
      info.append(title, meta);
      card.appendChild(info);
      return card;
    }

    function renderBooks(books) {
      results.textContent = '';
      books.forEach((book) => results.appendChild(createCard(book)));
    }

    function showSkeletons(count) {
      results.textContent = '';
      for (let i = 0; i < count; i++) {
        const card = document.createElement('article');
        card.className = 'book-card skeleton';
        card.innerHTML = '<div class="no-cover"></div><div class="book-info"><div class="line"></div><div class="line short"></div></div>';
        results.appendChild(card);
      }
    }

    function showMessage(text, isError) {
      const p = document.createElement('p');
      p.className = isError ? 'message error' : 'message';
      p.textContent = text;
      results.replaceChildren(p);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) {
        statusText.textContent = 'Please type a book title.';
        return;
      }

      statusText.textContent = 'Searching for "' + query + '"…';
      button.disabled = true;
      button.textContent = 'Searching…';
      showSkeletons(6);

      try {
        const books = await searchBooks(query);
        if (books.length === 0) {
          statusText.textContent = '';
          showMessage('No books found for "' + query + '". Try another title.', false);
          return;
        }
        renderBooks(books);
        statusText.textContent = 'Showing ' + books.length + ' results for "' + query + '"';
      } catch (err) {
        console.error('Error:', err);
        statusText.textContent = '';
        showMessage('Could not reach Open Library. Check your connection and try again.', true);
      } finally {
        button.disabled = false;
        button.textContent = 'Search';
      }
    });
  </script>
</body>
</html>
